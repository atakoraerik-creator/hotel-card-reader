[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-door-card-reader"
version = "0.1.0"
description = "Read-only RFID/NFC hotel door card identification and diagnostics"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pyscard>=2.0,<3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2.2,<3",
    "python-dotenv>=1.0,<2",
]
dev = ["pytest>=8", "ruff>=0.13", "httpx>=0.27,<1"]

[project.scripts]
doorcard = "doorcard.cli:main"
doorcard-gui = "doorcard.app:main"
doorcard-web = "doorcard.web.__main__:main"

[tool.setuptools.packages.find]
include = ["doorcard*"]

[tool.setuptools.package-data]
"doorcard.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Broad catches are deliberate at PC/SC, vendor-SDK, and UI boundaries: unknown
# third-party exceptions must become diagnostics rather than crash the app.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
"doorcard/web/*.py" = ["B008"]
